<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="url(#bg)" rx="8" ry="8"/>
  
  <!-- Document icon -->
  <g transform="translate(150, 100)">
    <!-- Document rectangle -->
    <rect x="-25" y="-30" width="50" height="60" fill="rgba(255,255,255,0.9)" stroke="rgba(255,255,255,0.3)" stroke-width="2" rx="4" ry="4"/>
    
    <!-- Document lines -->
    <rect x="-20" y="-20" width="40" height="3" fill="#f093fb" rx="1" ry="1"/>
    <rect x="-20" y="-15" width="35" height="3" fill="#f093fb" rx="1" ry="1"/>
    <rect x="-20" y="-10" width="30" height="3" fill="#f093fb" rx="1" ry="1"/>
    <rect x="-20" y="-5" width="25" height="3" fill="#f093fb" rx="1" ry="1"/>
    <rect x="-20" y="0" width="20" height="3" fill="#f093fb" rx="1" ry="1"/>
    <rect x="-20" y="5" width="15" height="3" fill="#f093fb" rx="1" ry="1"/>
  </g>
  
  <!-- Post indicator text -->
  <text x="150" y="170" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    ARTICLE
  </text>
</svg>
