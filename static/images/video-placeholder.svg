<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="url(#bg)" rx="8" ry="8"/>
  
  <!-- Video icon -->
  <g transform="translate(150, 100)">
    <!-- Play button circle -->
    <circle cx="0" cy="0" r="40" fill="rgba(255,255,255,0.9)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    
    <!-- Play triangle -->
    <polygon points="8,0 -8,12 -8,-12" fill="#667eea" transform="translate(2, 0)"/>
  </g>
  
  <!-- Video indicator text -->
  <text x="150" y="170" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    VIDEO POST
  </text>
</svg>
